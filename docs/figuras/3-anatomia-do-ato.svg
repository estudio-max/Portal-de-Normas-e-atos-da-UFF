<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 520' width='100%' role='img' aria-label='Uma folha de documento com cinco chamadas indicando os campos: tipo, número e ano, órgão, ementa e processo SEI.'><title>Uma folha de documento com cinco chamadas indicando os campos: tipo, número e ano, órgão, ementa e processo SEI.</title><rect width='940' height='520' fill='#ffffff'/><text x='40' y='42' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' fill='#003366' font-weight='700' text-anchor='start' >O que tem dentro de um ato</text><text x='40' y='66' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#64748B' font-weight='400' text-anchor='start' >Os campos que o portal separa de cada documento</text><rect x='358' y='99' width='230' height='372' rx='3' fill='#00000010'/><rect x='355' y='96' width='230' height='372' rx='3' fill='#ffffff' stroke='#CBD5E1' stroke-width='1.4'/><rect x='377' y='120' width='110' height='7' rx='3.5' fill='#CBD5E1'/><path d='M585 124 H631' stroke='#EAB308' stroke-width='1.6'/><circle cx='585' cy='124' r='3.2' fill='#EAB308'/><text x='639' y='122' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='start' >TIPO</text><text x='639' y='137' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='start' >Portaria, Resolução,</text><text x='639' y='150' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='start' >Determinação de Serviço…</text><rect x='377' y='178' width='70' height='7' rx='3.5' fill='#CBD5E1'/><rect x='377' y='191' width='46' height='7' rx='3.5' fill='#CBD5E1'/><path d='M355 182 H309' stroke='#EAB308' stroke-width='1.6'/><circle cx='355' cy='182' r='3.2' fill='#EAB308'/><text x='301' y='180' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='end' >NÚMERO E ANO</text><text x='301' y='195' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='end' >A identidade do ato dentro</text><text x='301' y='208' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='end' >do órgão que o assinou</text><rect x='377' y='236' width='126' height='7' rx='3.5' fill='#CBD5E1'/><path d='M585 240 H631' stroke='#EAB308' stroke-width='1.6'/><circle cx='585' cy='240' r='3.2' fill='#EAB308'/><text x='639' y='238' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='start' >ÓRGÃO</text><text x='639' y='253' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='start' >Quem assinou: Reitoria, CEPEx,</text><text x='639' y='266' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='start' >uma pró-reitoria, uma faculdade</text><rect x='377' y='304' width='186' height='7' rx='3.5' fill='#CBD5E1'/><rect x='377' y='317' width='170' height='7' rx='3.5' fill='#CBD5E1'/><rect x='377' y='330' width='96' height='7' rx='3.5' fill='#CBD5E1'/><path d='M355 308 H309' stroke='#EAB308' stroke-width='1.6'/><circle cx='355' cy='308' r='3.2' fill='#EAB308'/><text x='301' y='306' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='end' >EMENTA</text><text x='301' y='321' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='end' >A frase que resume o que o ato faz.</text><text x='301' y='334' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='end' >É por ela que se pesquisa.</text><rect x='377' y='384' width='140' height='7' rx='3.5' fill='#CBD5E1'/