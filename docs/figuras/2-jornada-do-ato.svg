<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 420' width='100%' role='img' aria-label='Fluxo em cinco etapas: a UFF publica o PDF, um robô baixa, o texto é recortado em atos, os atos vão para a base e o usuário pesquisa.'><title>Fluxo em cinco etapas: a UFF publica o PDF, um robô baixa, o texto é recortado em atos, os atos vão para a base e o usuário pesquisa.</title><rect width='1000' height='420' fill='#ffffff'/><defs><marker id='seta' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#64748B'/></marker></defs><text x='40' y='42' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' fill='#003366' font-weight='700' text-anchor='start' >Como um ato do Boletim vira um registro pesquisável</text><text x='40' y='66' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#64748B' font-weight='400' text-anchor='start' >Do PDF publicado pela UFF até a busca no portal</text><rect x='40.0' y='110' width='168' height='118' rx='9' fill='#ffffff' stroke='#003366' stroke-width='1.6'/><g transform='translate(124.0,144)'><path d='M-16 12 h32 M-13 12 v-20 h26 v20 M-8 -4 h4 M0 -4 h4 M-8 3 h4 M0 3 h4 M-13 -8 l13 -9 l13 9' fill='none' stroke='#003366' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></g><text x='124.0' y='178' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#003366' font-weight='700' text-anchor='middle' >A UFF publica</text><text x='124.0' y='197' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >Boletim de Serviço em PDF,</text><text x='124.0' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >quase todo dia útil</text><path d='M216.0 169.0 h4.0' stroke='#64748B' stroke-width='1.8' marker-end='url(#seta)'/><rect x='228.0' y='110' width='168' height='118' rx='9' fill='#ffffff' stroke='#003366' stroke-width='1.6'/><g transform='translate(312.0,144)'><rect x='-13' y='-8' width='26' height='20' rx='4' fill='none' stroke='#003366' stroke-width='2'/><circle cx='-5' cy='0' r='2.4' fill='#003366'/><circle cx='5' cy='0' r='2.4' fill='#003366'/><path d='M-6 7 h12 M0 -8 v-7 M-18 2 h5 M18 2 h-5' stroke='#003366' stroke-width='2' stroke-linecap='round' fill='none'/><circle cx='0' cy='-16' r='2.5' fill='#003366'/></g><text x='312.0' y='178' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#003366' font-weight='700' text-anchor='middle' >Um robô baixa</text><text x='312.0' y='197' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >Todo dia às 19h10,</text><text x='312.0' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >sem ninguém apertar botão</text><path d='M404.0 169.0 h4.0' stroke='#64748B' stroke-width='1.8' marker-end='url(#seta)'/><rect x='416.0' y='110' width='168' height='118' rx='9' fill='#ffffff' stroke='#003366' stroke-width='1.6'/><g transform='translate(500.0,144)'><path d='M-11 -14 h16 l7 7 v21 h-23 z' fill='none' stroke='#003366' stroke-width='2' stroke-linejoin='round'/><path d='M-6 -6 h12 M-6 -1 h12' stroke='#003366' stroke-width='2' stroke-linecap='round'/><path d='M-9 5 h18' stroke='#003366' stroke-width='2' stroke-dasharray='3 3' stroke-linecap='round'/><path d='M-6 10 h12' stroke='#003366' stroke-width='2' stroke-linecap='round'/></g><text x='500.0' y='178' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#003366' font-weight='700' text-anchor='middle' >O texto é recortado</text><text x='500.0' y='197' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >Cada ato vira um registro:</text><text x='500.0' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >tipo, número, órgão, data, ementa</text><path d='M592.0 169.0 h4.0' stroke='#64748B' stroke-width='1.8' marker-end='url(#seta)'/><rect x='604.0' y='110' width='168' height='118' rx='9' fill='#ffffff' stroke='#003366' stroke-width='1.6'/><g transform='translate(688.0,144)'><ellipse cx='0' cy='-10' rx='15' ry='5.5' fill='none' stroke='#003366' stroke-width='2'/><path d='M-15 -10 v20 a15 5.5 0 0 0 30 0 v-20' fill='none' stroke='#003366' stroke-width='2'/><path d='M-15 0 a15 5.5 0 0 0 30 0' fill='none' stroke='#003366' stroke-width='2'/></g><text x='688.0' y='178' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#003366' font-weight='700' text-anchor='middle' >Vai para a base</text><text x='688.0' y='197' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >133 mil atos,</text><text x='688.0' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >de 2001 a hoje</text><path d='M780.0 169.0 h4.0' stroke='#64748B' stroke-width='1.8' marker-end='url(#seta)'/><rect x='792.0' y='110' width='168' height='118' rx='9' fill='#ffffff' stroke='#003366' stroke-width='1.6'/><g transform='translate(876.0,144)'><rect x='-16' y='-13' width='32' height='23' rx='3' fill='none' stroke='#003366' stroke-width='2'/><path d='M-6 14 h12' stroke='#003366' stroke-width='2' stroke-linecap='round'/><circle cx='1' cy='-3' r='6' fill='none' stroke='#003366' stroke-width='2'/><path d='M5.5 1.5 l6 6' stroke='#003366' stroke-width='2' stroke-linecap='round'/></g><text x='876.0' y='178' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#003366' font-weight='700' text-anchor='middle' >Você pesquisa</text><text x='876.0' y='197' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >Por palavra, número, órgão,</text><text x='876.0' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#64748B' font-weight='400' text-anchor='middle' >ano ou nome de pessoa</text><path d='M500.0 228 v38' stroke='#EAB308' stroke-width='1.6' stroke-dasharray='4 4'/><rect x='265.0' y='274' width='470' height='62' rx='8' fill='#FEFCE8' stroke='#EAB308' stroke-width='1.6' stroke-dasharray='6 4'/><text x='500.0' y='299' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#854D0E' font-weight='700' text-anchor='middle' >É aqui que mora a dificuldade.</text><text x='500.0' y='318' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#854D0E' font-weight='400' text-anchor='middle' >O PDF não diz onde um ato termina e o outro começa.</text></svg>