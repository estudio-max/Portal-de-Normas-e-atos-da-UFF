<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 510' width='100%' role='img' aria-label='Cinco atos numa linha do tempo. Dois alteram o ato de 2015 e um o revoga em 2024, deixando-o marcado como revogado.'><title>Cinco atos numa linha do tempo. Dois alteram o ato de 2015 e um o revoga em 2024, deixando-o marcado como revogado.</title><rect width='960' height='510' fill='#ffffff'/><defs><marker id='ptaB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='5.5' markerHeight='5.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#64748B'/></marker><marker id='ptaD' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='5.5' markerHeight='5.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#64748B'/></marker><marker id='ptaE' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='5.5' markerHeight='5.5' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' fill='#DC2626'/></marker></defs><text x='40' y='42' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' fill='#003366' font-weight='700' text-anchor='start' >Esta norma ainda vale?</text><text x='40' y='66' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#64748B' font-weight='400' text-anchor='start' >Um ato não anuncia a própria revogação. Ela mora no ato posterior.</text><path d='M70 290 H700' stroke='#E2E8F0' stroke-width='2'/><path d='M250 264 C 250 198, 110 198, 110 264' fill='none' stroke='#64748B' stroke-width='1.8' marker-end='url(#ptaB)'/><text x='180.0' y='194' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#64748B' font-weight='700' text-anchor='middle' stroke='#ffffff' stroke-width='4' paint-order='stroke'>ALTERA</text><path d='M530 264 C 530 164, 110 164, 110 264' fill='none' stroke='#64748B' stroke-width='1.8' marker-end='url(#ptaD)'/><text x='320.0' y='160' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#64748B' font-weight='700' text-anchor='middle' stroke='#ffffff' stroke-width='4' paint-order='stroke'>ALTERA</text><path d='M670 264 C 670 130, 110 130, 110 264' fill='none' stroke='#DC2626' stroke-width='3.2' marker-end='url(#ptaE)'/><text x='390.0' y='126' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='11' fill='#DC2626' font-weight='700' text-anchor='middle' stroke='#ffffff' stroke-width='4' paint-order='stroke'>REVOGA</text><circle cx='110' cy='290' r='26' fill='#DC2626' opacity='0.14'/><circle cx='110' cy='290' r='19' fill='#DC2626'/><text x='110' y='295' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle' >A</text><text x='110' y='338' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='middle' >2015</text><path d='M80 312 L140 268' stroke='#DC2626' stroke-width='3' stroke-linecap='round'/><text x='110' y='356' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#DC2626' font-weight='700' text-anchor='middle' >REVOGADO</text><circle cx='250' cy='290' r='26' fill='#EAB308' opacity='0.14'/><circle cx='250' cy='290' r='19' fill='#EAB308'/><text x='250' y='295' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle' >B</text><text x='250' y='338' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='middle' >2018</text><circle cx='390' cy='290' r='26' fill='#059669' opacity='0.14'/><circle cx='390' cy='290' r='19' fill='#059669'/><text x='390' y='295' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle' >C</text><text x='390' y='338' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='middle' >2019</text><circle cx='530' cy='290' r='26' fill='#EAB308' opacity='0.14'/><circle cx='530' cy='290' r='19' fill='#EAB308'/><text x='530' y='295' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle' >D</text><text x='530' y='338' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='middle' >2021</text><circle cx='670' cy='290' r='26' fill='#DC2626' opacity='0.14'/><circle cx='670' cy='290' r='19' fill='#DC2626'/><text x='670' y='295' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#ffffff' font-weight='700' text-anchor='middle' >E</text><text x='670' y='338' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12.5' fill='#003366' font-weight='700' text-anchor='middle' >2024</text><circle cx='96' cy='398' r='7' fill='#059669'/><text x='114' y='402' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#0f172a' font-weight='400' text-anchor='start' >Vigente. Nenhum ato posterior o atingiu</text><circle cx='96' cy='424' r='7' fill='#EAB308'/><text x='114' y='428' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#0f172a' font-weight='400' text-anchor='start' >Alterado. Continua valendo, mas mudou</text><circle cx='96' cy='450' r='7' fill='#DC2626'/><text x='114' y='454' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#0f172a' font-weight='400' text-anchor='start' >Revogado. Não vale mais</text><rect x='610' y='378' width='300' height='96' rx='9' fill='#FEFCE8' stroke='#EAB308' stroke-width='1.6'/><text x='760.0' y='410' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#854D0E' font-weight='700' text-anchor='middle' >O ato de 2015 não sabe</text><text x='760.0' y='430' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#854D0E' font-weight='700' text-anchor='middle' >que foi revogado em 2024.</text><text x='760.0' y='454' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13.5' fill='#854D0E' font-weight='400' text-anchor='middle' >Quem sabe é o portal.</text></svg>