name: Indexar Boletins UFF

# Roda na nuvem (sem depender de nenhuma máquina local):
#  - todo dia às 22:10 UTC (~19:10 em Brasília, BRT/UTC-3)
#  - manualmente pelo botão "Run workflow"
#  - ao alterar os scripts/o workflow (para testar)
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/indexar.yml"
      - "tools/**"

# permite ao job dar commit do índice atualizado de volta no repositório
permissions:
  contents: write

concurrency:
  group: indexar-boletins
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install --quiet pymupdf openpyxl

      # Cache dos PDFs já processados (infra do GitHub, efêmera) — assim só os
      # boletins NOVOS são lidos do servidor da UFF a cada dia. Os PDFs nunca
      # são commitados; o repositório guarda apenas o índice gerado.
      - name: Cache dos boletins
        uses: actions/cache@v4
        with:
          path: boletins
          key: boletins-${{ github.run_id }}
          restore-keys: |
            boletins-

      # Download incompleto (exit 2) NÃO derruba o job — a trava anti-regressão
      # adiante garante que uma base parcial nunca substitua a completa.
      - name: Baixar boletins novos da UFF
        continue-on-error: true
        run: python tools/baixar_boletins.py --pasta boletins

      - name: Indexar (extrair atos e relações)
        run: python tools/extrair_boletim.py --pasta boletins --saida out

      - name: Gerar base do portal (com link do PDF na UFF)
        run: |
          python tools/gerar_dados_portal.py \
            --entrada out/atos.json \
            --saida public/portal-data.json \
            --urls boletins/_urls.json
          cp out/atos.csv public/atos.csv || true

      - name: Publicar índice atualizado (com trava anti-regressão)
        run: |
          NEW=$(python -c "import json;print(len(json.load(open('public/portal-data.json'))))")
          OLD=$(git show HEAD:public/portal-data.json 2>/dev/null | python -c "import sys,json;print(len(json.load(sys.stdin)))" 2>/dev/null || echo 0)
          echo "Atos: novo=$NEW | publicado=$OLD"
          if [ "$NEW" -lt "$OLD" ]; then
            echo "::warning::Base nova ($NEW) menor que a publicada ($OLD) — download provavelmente incompleto. NÃO vou publicar (mantenho a base completa)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/portal-data.json public/atos.csv
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no índice — nada a publicar."
          else
            git commit -m "Atualiza índice de atos (automático) — $(date +%F)"
            git push
            echo "Índice publicado no repositório."
            echo
            echo "O QUE ISTO ATUALIZOU: apenas o public/portal-data.json, que"
            echo "alimenta o MODO ESTÁTICO de contingência (o front o lê do raw"
            echo "do GitHub quando a API não responde)."
            echo
            echo "O QUE ISTO **NÃO** ATUALIZOU: o site em produção. O banco"
            echo "MySQL e a API PHP no HostGator não são tocados por este"
            echo "workflow — não há SSH nem deploy automático. Enquanto o"
            echo "importador não rodar, o portal no ar segue sem estes atos."
            echo
            echo "Para publicar de verdade (passo manual, ver CLAUDE.md):"
            echo "  1. suba public/portal-data.json para a pasta importar/ do servidor;"
            echo "  2. visite importar/importar_v2.php?token=<import_token>&arquivo=<nome>.json"
            echo "     (é idempotente: o upsert casa por chave natural e não duplica);"
            echo "  3. ele chama o resolver_relacoes_v2.php e zera o cache da API sozinho."
            echo
            echo "COBERTURA do importador: ele preenche ato_comissao e ato_ods"
            echo "sozinho (o ods_match.php passou a rodar no import em 03/08/2026)."
            echo
            echo "A EXCEÇÃO hoje é ato_politica: o vínculo ato<->política NÃO é"
            echo "criado no import. Ato novo entra no acervo e não aparece no"
            echo "dossiê da política até alguém regerar o seed. Ver a pendência"
            echo "no CLAUDE.md."
          fi

      # ---------------------------------------------------------------------
      # Espelha a base num repositório PÚBLICO separado, que só tem os dados.
      #
      # POR QUÊ: duas peças do portal precisam ler este índice de um endereço
      # SEM SENHA — o importador do servidor (cron 12h/20h) e o modo de
      # contingência, que roda no navegador do visitante. Enquanto o índice
      # morava só aqui, fechar este repositório derrubava as duas de uma vez,
      # em silêncio (foi o que aconteceu em 13/08/2026). Com o espelho, este
      # repositório pode ser fechado sem quebrar nada.
      #
      # O modo de contingência é o caso que NÃO tem outra saída: ele busca do
      # navegador do visitante, então não existe token que dê para usar ali
      # sem expor a chave a qualquer um no DevTools.
      #
      # CHAVE: deploy key com escrita SOMENTE no repositório de dados — não é
      # token de conta. Se vazar, o estrago se limita a um repositório que só
      # contém dado já público.
      #
      # Sem a chave configurada o passo SAI LIMPO em vez de falhar — assim o
      # workflow segue verde e a publicação daqui (que é o que alimenta o
      # portal hoje) nunca é bloqueada por causa do espelho.
      #
      # A checagem é feita no SHELL, e não num `if:` de step: a presença do
      # contexto `secrets` em condição de step é inconsistente entre versões
      # do Actions, e um `if` que silenciosamente vira sempre-falso pularia o
      # espelho para sempre sem ninguém notar — exatamente a classe de defeito
      # que este trabalho todo está tentando eliminar.
      - name: Espelhar dados no repositório público
        env:
          CHAVE: ${{ secrets.DADOS_DEPLOY_KEY }}
          DESTINO: git@github.com:estudio-max/Portal-de-Normas-e-atos-da-UFF-dados.git
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::notice::DADOS_DEPLOY_KEY não configurada — espelho público PULADO."
            echo "O portal segue lendo deste repositório. Ver CLAUDE.md."
            exit 0
          fi
          if [ ! -f public/portal-data.json ]; then
            echo "::warning::public/portal-data.json não existe — nada a espelhar."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 "$DESTINO" /tmp/dados
          cp public/portal-data.json /tmp/dados/portal-data.json
          cp public/atos.csv /tmp/dados/atos.csv 2>/dev/null || true
          cd /tmp/dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Espelho já estava em dia — nada a publicar."
          else
            git commit -m "Atualiza base do portal (automático) — $(date +%F)"
            git push
            echo "Espelho público atualizado."
          fi
