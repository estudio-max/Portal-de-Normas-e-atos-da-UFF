name: CI

# Barreira de qualidade: todo push/PR passa por type-check, build e pelos
# testes de regressão que rodam sem o corpus.
#
# O job `extrator` cobre os testes de tools/ que são UNITÁRIOS — texto de
# entrada escrito no próprio teste, estrutura esperada na saída. Eles não
# precisam do corpus de boletins (que é local e não vive no repositório), ao
# contrário do que este cabeçalho afirmou até 16/08/2026: a afirmação estava
# errada e mantinha o arquivo mais sensível do projeto sem cobertura nenhuma.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "backend/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/ci.yml"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Regressão estrutural do redesign
        run: node tools/test_redesign_integrity.mjs

      # Selos de Requisito do RSC na aba Meu SIAPE. Como o classificador é regex
      # sobre a ementa, ele tem a mesma fragilidade do ods_match: mexer num
      # padrão reintroduz falso positivo já pago. Cada caso do teste é uma isca
      # medida em 06/08/2026 — inclusive o bloco de assinatura, que sozinho
      # respondia por 101 dos 112 falsos do Requisito V.
      - name: Regressão dos requisitos do RSC
        run: npx tsx tools/teste_rsc_requisitos.ts

      # A migração do núcleo analítico é aplicada à mão no phpMyAdmin, sem SSH e
      # sem rollback barato. Este teste lê o .sql como texto e reprova o que só
      # se descobriria no meio da janela de deploy: SQL de MySQL 8, tabela sem
      # chave natural, coluna indexada acima do limite do InnoDB, FK faltando.
      - name: Regressão do schema de inteligência institucional
        run: node tools/teste_schema_inteligencia.mjs

      - name: Regressão do schema de múltiplas revalidações
        run: node tools/teste_ato_revalidacao_schema.mjs

  # A classificação ODS roda no import (backend/importar/ods_match.php) e é a
  # única parte do backend que dá para testar sem banco: é regex puro sobre o
  # dispositivo. Cada caso do teste é um falso-positivo que já esteve em
  # produção — sem esta barreira, mexer nos padrões reintroduz defeito pago.
  ods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Sintaxe do PHP versionado
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || { php -l "$f"; exit 1; }; done
          echo "$(git ls-files '*.php' | wc -l) arquivo(s) PHP sem erro de sintaxe."

      - name: Regressão da classificação ODS
        run: php backend/importar/teste_ods_match.php

      # A aba Comissões afirma que um ato é da vida de um colegiado. O erro
      # caro é o homônimo de UNIDADE (cada unidade tem a sua biossegurança, a
      # sua acessibilidade, e o HUAP tem a sua Comissão Permanente de
      # Flexibilização escrita igualzinho à central). Cada caso do teste é uma
      # ementa real do acervo, medida antes de virar regra.
      - name: Regressão do vínculo ato↔comissão
        run: php backend/importar/teste_comissoes_match.php

      # O vínculo ato<->política roda no import diário e é dossiê: ele afirma
      # que um ato construiu uma política e diz que papel cumpriu. Rótulo
      # errado aqui não é imprecisão de contagem — é atribuir a uma política
      # um ato que não é dela.
      - name: Regressão do vínculo ato↔política
        run: php backend/importar/teste_politicas_match.php

      # A série histórica de etapas só vale se ganhar linha quando algo
      # acontece na política, e não quando o calendário anda. Com o cron
      # 2x/dia, um snapshot gravado à toa vira 730 linhas por ano.
      - name: Regressão do snapshot de etapas
        run: php backend/importar/teste_indicador_politica.php

      - name: Regressão da lista de revalidações no importador
        run: php backend/importar/teste_revalidacao_lista.php

      - name: Regressão da lista histórica de revalidações
        run: php backend/importar/teste_revalidacao_lista_legada.php

      - name: Regressão da sincronização atômica de revalidações
        run: php backend/importar/teste_revalidacao_sincronizacao.php

      # O corpo do ato viaja no JSON numa forma só (caixa preservada) e o
      # `texto_busca` — que alimenta o FULLTEXT — é DERIVADO aqui por
      # mb_strtolower(). Python, PHP e JavaScript precisam rebaixar a caixa
      # igual: se um divergir numa letra, a mesma busca passa a dar resultado
      # diferente no modo banco e no modo estático, sem erro e sem log. A
      # amostra é a mesma que o teste Python confere.
      - name: Regressão da caixa do corpo do ato
        run: php backend/importar/teste_caixa_texto.php

  # O extrator é o arquivo mais sensível do projeto: um padrão que deixa de
  # casar não quebra nada visivelmente — o dado simplesmente para de existir,
  # e ninguém percebe até alguém procurar por ele meses depois.
  extrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pymupdf porque extrair_boletim.py importa fitz no topo do módulo — os
      # testes não abrem PDF nenhum, mas o import precisa resolver.
      - name: Dependências
        run: pip install --quiet pymupdf

      - name: Sintaxe
        run: python -m compileall -q tools/extrair_boletim.py

      # Whitelist de cargos + verbo do dispositivo: duas listas fáceis de
      # deixar incompletas, e a falha é silenciosa (a função some da ficha).
      - name: Regressão dos cargos de direção
        run: python tools/teste_funcoes_cd.py

      # Revalidação de diploma: duas famílias com redações incompatíveis, nome
      # de país que varia (e que a fonte às vezes digita errado), e um
      # invariante de PRIVACIDADE — o nome da pessoa não pode aparecer na
      # saída, porque o painel é agregado por decisão do mantenedor.
      - name: Regressão da revalidação de diplomas
        run: python tools/teste_revalidacao.py

      - name: Regressão do contrato de dados do portal
        run: python tools/teste_dados_portal.py
