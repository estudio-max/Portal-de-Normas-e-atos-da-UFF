name: CI

# Barreira de qualidade: todo push/PR passa por type-check, build e pelos
# testes de regressão que rodam sem o corpus.
# Não valida o extrator aqui — os testes dele (tools/teste_*.py) comparam
# contra o corpus de boletins, que é local e não vive no repositório.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "backend/**"
      - "tools/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".github/workflows/ci.yml"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check (lint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Regressão estrutural do redesign
        run: node tools/test_redesign_integrity.mjs

      # A migração do núcleo analítico é aplicada à mão no phpMyAdmin, sem SSH e
      # sem rollback barato. Este teste lê o .sql como texto e reprova o que só
      # se descobriria no meio da janela de deploy: SQL de MySQL 8, tabela sem
      # chave natural, coluna indexada acima do limite do InnoDB, FK faltando.
      - name: Regressão do schema de inteligência institucional
        run: node tools/teste_schema_inteligencia.mjs

  # A classificação ODS roda no import (backend/importar/ods_match.php) e é a
  # única parte do backend que dá para testar sem banco: é regex puro sobre o
  # dispositivo. Cada caso do teste é um falso-positivo que já esteve em
  # produção — sem esta barreira, mexer nos padrões reintroduz defeito pago.
  ods:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Sintaxe do PHP versionado
        run: |
          for f in $(git ls-files '*.php'); do php -l "$f" > /dev/null || { php -l "$f"; exit 1; }; done
          echo "$(git ls-files '*.php' | wc -l) arquivo(s) PHP sem erro de sintaxe."

      - name: Regressão da classificação ODS
        run: php backend/importar/teste_ods_match.php

      # O vínculo ato<->política roda no import diário e é dossiê: ele afirma
      # que um ato construiu uma política e diz que papel cumpriu. Rótulo
      # errado aqui não é imprecisão de contagem — é atribuir a uma política
      # um ato que não é dela.
      - name: Regressão do vínculo ato↔política
        run: php backend/importar/teste_politicas_match.php
